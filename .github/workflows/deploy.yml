name: Deploy AWS

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do commit aprovado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar acesso SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Preparar diretorio na AWS
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p '$DEPLOY_DIR'"

      - name: Empacotar aplicacao
        run: |
          tar \
            --exclude='.git' \
            --exclude='target' \
            -czf /tmp/app.tar.gz .

      - name: Enviar aplicacao para AWS
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          scp /tmp/app.tar.gz "$EC2_USER@$EC2_HOST:$DEPLOY_DIR/app.tar.gz"

      - name: Build e deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_PORT: ${{ vars.APP_PORT }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -s -- \
            "$DEPLOY_DIR" \
            "$APP_NAME" \
            "$APP_PORT" \
            "$DOCKER_NETWORK" <<'EOF'

          set -e

          DEPLOY_DIR="$1"
          APP_NAME="$2"
          APP_PORT="$3"
          DOCKER_NETWORK="$4"

          if [ ! -f "$DEPLOY_DIR/app.env" ]; then
            echo "Arquivo app.env nao encontrado"
            exit 1
          fi

          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || docker network create "$DOCKER_NETWORK"

          rm -rf "$DEPLOY_DIR/app"
          mkdir -p "$DEPLOY_DIR/app"

          tar -xzf "$DEPLOY_DIR/app.tar.gz" \
            -C "$DEPLOY_DIR/app"

          rm "$DEPLOY_DIR/app.tar.gz"

          cd "$DEPLOY_DIR/app"

          docker build -t "$APP_NAME:latest" .

          docker rm -f "$APP_NAME" 2>/dev/null || true

          docker run -d \
            --name "$APP_NAME" \
            --network "$DOCKER_NETWORK" \
            --env-file "$DEPLOY_DIR/app.env" \
            -p "$APP_PORT:8080" \
            --restart unless-stopped \
            "$APP_NAME:latest"

          sleep 10

          STATUS=$(docker inspect \
            -f '{{.State.Status}}' \
            "$APP_NAME")

          echo "Status da aplicacao: $STATUS"

          if [ "$STATUS" != "running" ]; then
            docker logs "$APP_NAME"
            exit 1
          fi

          docker ps --filter "name=$APP_NAME"

          EOF